<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Data</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow">
        <div class="container">
            <a class="navbar-brand" href="#">Wayback Master</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Search</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">Domains</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/manage-filters">Extensions</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
<br>
<br>
    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-header text-center bg-primary text-white">
                <h2>Fetch Archived URLs</h2>
            </div>
            <div class="card-body">
                <form id="fetch-form" method="POST" action="">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="domain" class="form-label">Enter Domain</label>
                        <input type="text" class="form-control" id="domain" name="domain" placeholder="example.com" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Fetch Data</button>
                    </div>
                </form>
                <!-- Loading Bar -->
                <div id="loading">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3">Processing your request. This may take a few seconds...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- templates/partials/footer.html -->
<footer class="bg-light text-center text-lg-start mt-5 border-top">
    <div class="text-center p-3">
        © 2025 Wayback Master — All rights reserved.
    </div>
</footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.getElementById('fetch-form');
        const loading = document.getElementById('loading');

        form.addEventListener('submit', function () {
            // Show the loading bar
            loading.style.display = 'block';
        });
    </script>
</body>
</html>
